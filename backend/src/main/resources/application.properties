spring.application.name=employee-app

spring.datasource.url=jdbc:postgresql://localhost:5433/rightsku_employee
spring.datasource.username=rightsku
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# JWT: the secret comes only from the JWT_SECRET environment variable
# (at least 32 bytes). Tokens expire after this duration.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=8h

# One-time HR Admin bootstrap. It is OFF unless the environment variable
# HR_ADMIN_BOOTSTRAP_ENABLED=true is set. The password is read only from the
# HR_ADMIN_BOOTSTRAP_PASSWORD environment variable; never put it in this file.
app.bootstrap.hr-admin.email=hr@rightsku.com

# Login rate limiting (failed sign-ins only; see LoginRateLimiter).
# Per Employee ID/email + network address, and per network address.
app.login.rate-limit.max-failures-per-account=5
app.login.rate-limit.max-failures-per-address=30
app.login.rate-limit.window=15m

# "Forgot password" emails a one-time code. It stays switched off (the app
# says "Contact HR") until BOTH are set as environment variables:
#   - the SMTP server: SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
#     SPRING_MAIL_PASSWORD, SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true,
#     SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
#   - the sender address: PASSWORD_RESET_MAIL_FROM (e.g. no-reply@rightsku.com)
# Never put the SMTP password in this file.
app.password-reset.mail-from=${PASSWORD_RESET_MAIL_FROM:}

# Company time zone: decides what "today" is for timesheets and holidays.
app.time-zone=Asia/Kolkata

# Employee documents (stored in PostgreSQL). Uploads larger than 10 MB are
# refused. Files up to the threshold stay in memory while uploading, so no
# temporary copy is written to the server's disk.
app.documents.max-bytes=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.servlet.multipart.file-size-threshold=11MB
# Read (and discard) oversized uploads up to 20 MB so the app gets the clear
# "file too large" answer instead of a dropped connection.
server.tomcat.max-swallow-size=20MB

# Origins allowed to call the API (comma-separated). The Android app calls from
# https://localhost. This default also allows the local web dev server; in
# production set APP_CORS_ALLOWED_ORIGINS=https://localhost,capacitor://localhost
app.cors.allowed-origins=http://localhost:5174,http://127.0.0.1:5174,https://localhost,capacitor://localhost

# Health check: only /actuator/health is exposed, and it answers UP or DOWN
# (database included) with no details. No other actuator endpoint is on the web.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false
management.info.env.enabled=false

# On restart, let requests in progress (e.g. a document upload) finish first.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Company default working schedule, used for an employee until HR sets one.
app.schedule.default-weekly-offs=SATURDAY,SUNDAY
app.schedule.default-hours-per-day=9
